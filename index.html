<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Face Game</title>
<style>
body{margin:0;overflow:hidden;background:#111}
canvas{display:block;margin:auto;background:#222}
</style>
</head>
<body>

<audio id="hitSound" src="modi.mp3" preload="auto"></audio>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Sound
const hitSound = document.getElementById("hitSound");
let soundEnabled = false;

// Enable sound & jump on any click/tap
document.addEventListener("click", () => { soundEnabled = true; player.v = lift; if(gameOver) restart(); });
document.addEventListener("touchstart", () => { soundEnabled = true; player.v = lift; if(gameOver) restart(); });
document.addEventListener("keydown", e => { if(e.code=="Space" || e.code=="ArrowUp"){ player.v = lift; if(gameOver) restart(); } });

// Play sound function
function playSound() {
  if(!soundEnabled) return;
  hitSound.currentTime = 0;
  hitSound.play().catch(()=>{});
}

// Player
let gravity = 0.35; // smooth fall
let lift = -10;     // jump height
let score = 0;
let gameOver = false;
const face = new Image();
face.src = "face.png"; // your face image
const player = { x:80, y:canvas.height/2, r:33, v:0 };

// Pillars
let pillars = [];
let pillarSpeed = 6; // gradually increase

function newPillar(){
  let gap = 200;
  let top = Math.random()*(canvas.height-300)+50;
  pillars.push({x:canvas.width, top:top, bottom:top+gap, w:50});
}

// Update
function update(){
  if(gameOver) return;

  player.v += gravity;
  player.y += player.v;

  if(player.y+player.r>canvas.height || player.y-player.r<0){
    gameOver = true;
    playSound();
  }

  if(pillars.length==0 || pillars[pillars.length-1].x < canvas.width-350){
    newPillar();
  }

  pillars.forEach(p=>{
    p.x -= pillarSpeed;
    // collision
    if(player.x+player.r>p.x && player.x-player.r<p.x+p.w){
      if(player.y-player.r<p.top || player.y+player.r>p.bottom){
        gameOver = true;
        playSound();
      }
    }
    if(p.x+p.w === player.x) score++;
  });

  pillarSpeed += 0.0005; // gradually speed up
}

// Draw
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Player (face)
  ctx.save();
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.clip();
  ctx.drawImage(face,player.x-player.r,player.y-player.r,player.r*2,player.r*2);
  ctx.restore();

  // Pillars with gradient
  pillars.forEach(p=>{
    let gradTop = ctx.createLinearGradient(p.x,0,p.x,p.top);
    gradTop.addColorStop(0,"#00ff00");
    gradTop.addColorStop(1,"#ffff00");
    ctx.fillStyle = gradTop;
    roundRect(ctx,p.x,0,p.w,p.top,15,true,false);

    let gradBottom = ctx.createLinearGradient(p.x,p.bottom,p.x,canvas.height);
    gradBottom.addColorStop(0,"#00ff00");
    gradBottom.addColorStop(1,"#ffff00");
    ctx.fillStyle = gradBottom;
    roundRect(ctx,p.x,p.bottom,p.w,canvas.height-p.bottom,15,true,false);
  });

  // Score
  ctx.fillStyle="white";
  ctx.font="20px Arial";
  ctx.fillText("Score: "+score,20,30);

  // Game Over
  if(gameOver){
    ctx.fillStyle="red";
    ctx.font="40px Arial";
    ctx.fillText("💥 LAG GAYA 😂",canvas.width/2-120,canvas.height/2);
    ctx.font="20px Arial";
    ctx.fillText("Click/Tap/Space to restart",canvas.width/2-110,canvas.height/2+40);
  }
}

// Function for rounded rectangles
function roundRect(ctx, x, y, w, h, r, fill, stroke){
  if (typeof stroke == "undefined") stroke = true;
  if (typeof r === "undefined") r = 5;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
  if(fill) ctx.fill();
  if(stroke) ctx.stroke();
}

// Restart function
function restart(){
  gameOver = false;
  player.y = canvas.height/2;
  player.v = 0;
  pillars = [];
  score = 0;
  pillarSpeed = 6;
}

// Loop
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
